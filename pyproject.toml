[project]
name = "dscforge"
version = "0.1.4"
description = "Check whether your project will work for someone else"
authors = [{ name = "Jacob Doan" }]
requires-python = ">=3.11"
dependencies = [
    "click"
]

[project.scripts]
dscforge = "dscforge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["dscforge"]

[tool.setuptools.package-data]
"dscforge" = ["ai_phrases.txt", "leftover_files.txt", "known_packages.txt"]